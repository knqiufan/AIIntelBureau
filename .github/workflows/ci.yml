name: CI quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.11" }
      - name: Install locked backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install --require-hashes -r backend/requirements.lock && python -m pip check
      - name: Test backend
        working-directory: backend
        run: python -m pytest
      - name: Audit Python dependencies
        run: python -m pip install pip-audit && pip-audit --requirement backend/requirements.lock --strict

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "22", cache: "npm", cache-dependency-path: web/package-lock.json }
      - name: Install locked frontend dependencies
        working-directory: web
        run: npm ci
      - name: Lint, unit test, and build
        working-directory: web
        run: npm run lint && npm test && npm run build
      - name: Audit production frontend dependencies
        working-directory: web
        run: npm audit --omit=dev --audit-level=high
      - name: Install Playwright browser
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Browser regression tests
        working-directory: web
        env:
          DEMO_ALLOW_FREEFORM_WHISPER: "true"
        run: npm run test:e2e && npm run test:e2e:auth
      - name: Retain browser failures
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: playwright-results, path: web/test-results, if-no-files-found: ignore }

  container-and-sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate production Compose model
        run: docker compose --profile production config --quiet
      - name: Build production images
        run: docker compose --profile production build
      - name: Generate source SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with: { path: ., format: cyclonedx-json, output-file: sbom.cdx.json }
      - name: Retain SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: sbom, path: sbom.cdx.json }
