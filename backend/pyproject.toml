[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-intel-bureau-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.139.2",
  "starlette==1.3.1",
  "uvicorn[standard]==0.51.0",
  "pydantic==2.12.4",
  "pydantic-settings==2.14.2",
  "httpx[socks]==0.28.1",
  "openai==2.46.0",
  "powermem==1.1.7",
  # PowerMem 1.1.7 requires greenlet <3 on Python 3.11.  Keep the lock
  # resolver from selecting an incompatible transitive release.
  "greenlet==2.0.2; python_version < '3.12'",
  "pyobvector[pyseekdb]==0.2.26",
  # pyseekdb leaves this Linux runtime dependency unpinned in its metadata;
  # declare it here so pip's hash-enforced production install remains closed.
  "pylibseekdb==1.3.0.post3; sys_platform == 'linux'",
  # VertexAI leaves the platform package unbounded; pin the patched release.
  "google-cloud-aiplatform==1.162.0",
  "deepagents==0.6.12",
  "langchain==1.3.14",
  "langchain-openai==1.2.2",
  "langgraph==1.2.9",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
