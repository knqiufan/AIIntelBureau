[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-intel-bureau-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.142.2",
  "starlette==1.7.0",
  "uvicorn[standard]==0.54.0",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "httpx[socks]==0.28.1",
  # Transitive dependencies pinned explicitly to keep the audit gate green.
  "aiohttp==3.14.3",
  "cryptography==50.0.1",
  "multidict==6.9.1",
  "openai==2.54.0",
  "powermem==1.1.7",
  "pyjwt==2.15.1",
  "urllib3==2.8.0",
  # PowerMem 1.1.7 requires greenlet <3 on Python 3.11.  Keep the lock
  # resolver from selecting an incompatible transitive release.
  "greenlet==2.0.2; python_version < '3.12'",
  "pyobvector[pyseekdb]==0.2.29",
  # pyseekdb leaves this Linux runtime dependency unpinned in its metadata;
  # declare it here so pip's hash-enforced production install remains closed.
  "pylibseekdb==1.4.0.post1; sys_platform == 'linux'",
  # VertexAI leaves the platform package unbounded; pin the patched release.
  "google-cloud-aiplatform==2.3.0",
  "deepagents==0.7.19",
  "langchain==1.4.3",
  "langchain-openai==1.6.7",
  "langgraph==1.2.12",
  "langgraph-sdk==0.4.4",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
