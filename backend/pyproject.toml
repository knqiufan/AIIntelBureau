[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-intel-bureau-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.128.0",
  "uvicorn[standard]==0.34.0",
  "pydantic==2.12.4",
  "pydantic-settings==2.12.0",
  "httpx[socks]==0.28.1",
  "openai==2.38.0",
  "powermem==1.1.7",
  "pyobvector[pyseekdb]==0.2.26",
  "deepagents==0.6.12",
  "langchain==1.2.17",
  "langchain-openai==1.2.2",
  "langgraph==1.1.10",
]

[project.optional-dependencies]
test = ["pytest==8.3.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
