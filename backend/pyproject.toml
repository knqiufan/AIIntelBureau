[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-intel-bureau-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.128.0",
  "uvicorn[standard]==0.34.0",
  "pydantic==2.12.4",
  "pydantic-settings==2.12.0",
  "httpx[socks]==0.28.1",
  "openai==2.38.0",
  "powermem==1.1.7",
  # PowerMem 1.1.7 requires greenlet <3 on Python 3.11.  Keep the lock
  # resolver from selecting an incompatible transitive release.
  "greenlet==2.0.2; python_version < '3.12'",
  "pyobvector[pyseekdb]==0.2.26",
  # pyseekdb leaves this Linux runtime dependency unpinned in its metadata;
  # declare it here so pip's hash-enforced production install remains closed.
  "pylibseekdb==1.3.0.post3; sys_platform == 'linux'",
  "deepagents==0.5.7",
  "langchain==1.3.14",
  "langchain-openai==1.2.2",
  "langgraph==1.1.10",
]

[project.optional-dependencies]
test = ["pytest==8.3.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
